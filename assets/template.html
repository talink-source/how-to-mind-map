<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Mono:wght@500;600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout idea: a left-to-right "how?" tree on a level-ruled canvas, with a detail rail for the selected node. */
:root{
  /* Studio palette: soft sage paper, deep forest ink, pastel tiles. Color on a node means its rating. */
  --bg:#eef0ea; --surface:#fcfcf9; --tile:#f2f3ee; --ink:#1f2b27; --strong:#26332f; --onstrong:#f3f2ea; --link:#c4cac3; --muted:#66706b; --faint:#a1a8a3;
  --line:#e1e4dd; --band:rgba(38,51,47,.025); --accent:#26332f; --hit:#e3ebc4;
  --r1:#b5643f; --r1bg:#f1d3c3; --r2:#9b7a2e; --r2bg:#ecdfb9; --r3:#52629f; --r3bg:#d6ddf2; --r4:#3e7655; --r4bg:#cfe3d4;
  --q:#6e5aa6; --qbg:#e7e0f3;
  --shadow:0 1px 2px rgba(31,43,39,.05),0 6px 18px rgba(31,43,39,.06);
  --toph:64px;
  --display:"Fraunces",ui-serif,Georgia,serif;
  --body:"Manrope",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141a18; --surface:#1c2421; --tile:#222b28; --ink:#eef0ea; --strong:#e9e8df; --onstrong:#1f2b27; --link:#3c4743; --muted:#a3ada8; --faint:#6c7672;
  --line:#2c3633; --band:rgba(255,255,255,.02); --accent:#e9e8df; --hit:#3d4626;
  --r1:#e9a585; --r1bg:#45302a; --r2:#dcc07a; --r2bg:#423a24; --r3:#a9b6ea; --r3bg:#2f3550; --r4:#93cfa6; --r4bg:#26402f;
  --q:#c3b3ef; --qbg:#342d48; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#141a18; --surface:#1c2421; --tile:#222b28; --ink:#eef0ea; --strong:#e9e8df; --onstrong:#1f2b27; --link:#3c4743; --muted:#a3ada8; --faint:#6c7672;
  --line:#2c3633; --band:rgba(255,255,255,.02); --accent:#e9e8df; --hit:#3d4626;
  --r1:#e9a585; --r1bg:#45302a; --r2:#dcc07a; --r2bg:#423a24; --r3:#a9b6ea; --r3bg:#2f3550; --r4:#93cfa6; --r4bg:#26402f;
  --q:#c3b3ef; --qbg:#342d48; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark;}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 11px;border:1px solid var(--line);background:var(--surface);border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--faint)}
.btn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.icon{width:32px;justify-content:center;padding:0;font-size:16px}
/* top bar */
#top{position:fixed;inset:0 0 auto 0;height:var(--toph);display:flex;align-items:center;gap:16px;padding:0 16px;background:var(--surface);border-bottom:1px solid var(--line);z-index:20}
#top h1{font-family:var(--display);font-size:16px;font-weight:700;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:220px;flex:0 1 auto}
.stats{display:flex;gap:14px;font-size:12px;color:var(--muted);white-space:nowrap}
.stats b{font-family:var(--mono);font-size:14px;color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.controls{margin-left:auto;display:flex;align-items:center;gap:6px}
.searchwrap{position:relative}
#q{height:32px;width:220px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
#results{position:absolute;top:38px;right:0;width:360px;max-height:360px;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 32px rgba(0,0,0,.14);display:none;padding:4px}
#results button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:7px;cursor:pointer;font-size:13px;line-height:18px}
#results button:hover,#results button.cur{background:var(--bg)}
#results small{display:block;color:var(--faint);font-size:11px;font-family:var(--mono)}
#lvSel{height:32px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:0 6px}
/* view tabs and save status */
.tabs{display:inline-flex;border:1px solid var(--line);border-radius:9px;padding:2px;background:var(--bg);flex:none}
.tabs button{border:0;background:none;height:28px;padding:0 12px;border-radius:7px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
.tabs button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
#top .lvlpick{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap}
#saveWrap{display:flex;align-items:center;gap:8px;flex:none}
#saveState{font-size:12px;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:6px}
#saveState i{width:8px;height:8px;border-radius:50%;background:var(--r4);display:inline-block}
#saveState.dirty i{background:var(--q)}
#saveBtn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
body:not(.view-map) .maponly{display:none!important}
/* level ruler */
#ruler{position:fixed;top:var(--toph);left:0;right:0;height:28px;background:var(--bg);border-bottom:1px solid var(--line);z-index:15;overflow:hidden}
.lvl{position:absolute;top:0;height:28px;display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;font-weight:600;color:var(--muted);white-space:nowrap}
.lvl span{color:var(--faint);font-weight:500}
/* canvas */
#stage{position:fixed;top:calc(var(--toph) + 28px);left:0;right:0;bottom:0;cursor:grab;touch-action:none}
#stage.drag{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#links{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.band{position:absolute;top:-20000px;height:60000px}
.node{position:absolute;display:flex;align-items:flex-start;gap:6px;padding:7px 26px 7px 12px;border-radius:9px;background:var(--surface);border:1px solid var(--line);font-size:12.5px;line-height:16px;cursor:pointer;user-select:none;box-shadow:0 1px 2px rgba(0,0,0,.05);transition:box-shadow .12s,border-color .12s}
.node:hover{border-color:var(--faint);box-shadow:0 3px 10px rgba(0,0,0,.10)}
.node.d1,.node.d2{background:var(--strong);color:var(--onstrong);border-color:var(--strong);font-weight:700;font-size:14px;line-height:19px}
.node.d3{font-weight:700;border:1.5px solid var(--ink)}
.node.rated{border-width:1.5px}
.node.sel{outline:2.5px solid var(--accent);outline-offset:2px}
.node.hit{background:var(--hit)}
.node.onpath{border-color:var(--ink);border-width:1.5px}
.node .t{flex:1}
.node .qd{width:16px;height:16px;border-radius:50%;background:var(--q);color:#fff;font-family:var(--mono);font-size:10px;font-weight:700;line-height:16px;text-align:center;flex:none}
.qbox{font-size:13.5px;line-height:20px;background:var(--qbg);color:var(--ink);border-left:3px solid var(--q);border-radius:6px;padding:10px 12px}
.qbox b{display:block;font-family:var(--mono);font-size:11px;color:var(--q);margin-bottom:3px}
.node .dot{width:6px;height:6px;border-radius:50%;background:var(--faint);margin-top:5px;flex:none}
.node .rate{position:absolute;top:-8px;left:10px;height:16px;padding:0 6px;border-radius:8px;font-family:var(--mono);font-size:10px;font-weight:600;line-height:16px;color:#fff}
.tog{position:absolute;right:-12px;top:50%;margin-top:-11px;min-width:22px;height:22px;padding:0 5px;border-radius:11px;background:var(--surface);border:1px solid var(--line);font-family:var(--mono);font-size:10.5px;font-weight:600;color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer}
.tog:hover{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.leaf .tog{display:none}
/* focus banner */
#banner{position:fixed;top:calc(var(--toph) + 38px);left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);font-size:13px;padding:7px 8px 7px 14px;border-radius:20px;display:none;align-items:center;gap:10px;z-index:16;box-shadow:0 6px 20px rgba(0,0,0,.2)}
#banner button{border:0;background:rgba(255,255,255,.16);color:inherit;border-radius:14px;padding:4px 10px;cursor:pointer;font-size:12px}
/* panel */
#panel{position:fixed;right:14px;top:calc(var(--toph) + 42px);bottom:14px;width:380px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.14);z-index:18;display:none;flex-direction:column;overflow:hidden}
#panel.open{display:flex}
.ph{padding:16px 18px 12px;border-bottom:1px solid var(--line)}
.eyebrow{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.02em}
#pT{font-family:var(--display);font-size:17px;line-height:23px;margin:6px 0 0;text-wrap:balance}
.pb{padding:14px 18px 18px;overflow:auto;display:flex;flex-direction:column;gap:16px}
.notes{font-size:13.5px;line-height:20px;background:var(--bg);border-radius:9px;padding:10px 12px;max-width:65ch}
.sect h3{margin:0 0 7px;font-family:var(--mono);font-size:11px;font-weight:600;color:var(--muted)}
.rates{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;align-items:stretch}
.rates button{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:3px;min-height:58px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 4px;cursor:pointer;font-size:11.5px;line-height:14px;text-align:center}
.rates button b{font-family:var(--mono);font-size:14px;line-height:16px}
.rates button span{display:block}
.savenote{font-size:11.5px;color:var(--faint);margin-top:6px;line-height:15px}
/* 2x2 view */
#quad{position:fixed;top:var(--toph);left:0;right:0;bottom:0;overflow:auto;background:var(--bg);display:none;z-index:17;padding:20px 16px 40px}
#quad .wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.qhead{display:flex;flex-wrap:wrap;align-items:center;gap:10px;justify-content:space-between}
.qhead p{margin:0;font-size:13px;color:var(--muted);max-width:65ch}
.qhead .acts{display:flex;gap:6px;flex-wrap:wrap}
.qgrid{display:grid;grid-template-columns:28px 1fr 1fr;grid-template-rows:1fr 1fr 28px;gap:10px;min-height:560px}
.axis{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--muted);display:flex;align-items:center;justify-content:space-between}
.axis.y{grid-column:1;grid-row:1 / span 2;writing-mode:vertical-rl;transform:rotate(180deg);padding:6px 0}
.axis.x{grid-column:2 / span 2;grid-row:3;padding:0 6px}
.qcell{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--c);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-height:0}
.qcell .qt{display:flex;align-items:baseline;gap:10px}
.qcell .qn{font-family:var(--mono);font-size:22px;font-weight:600;color:var(--c);line-height:24px}
.qcell h4{margin:0;font-size:15px;line-height:20px}
.qcell .qs{font-family:var(--mono);font-size:11px;color:var(--faint)}
.qcell .qg{font-size:13px;line-height:18px;color:var(--muted)}
.qcell .qg b{color:var(--ink);font-weight:600}
.qcell .qc{margin-left:auto;font-family:var(--mono);font-size:13px;font-weight:600;color:var(--ink)}
.qlist{display:flex;flex-direction:column;gap:4px;overflow:auto;max-height:300px}
.qlist button{border:1px solid var(--line);background:var(--bg);border-radius:7px;padding:6px 9px;text-align:left;cursor:pointer;font-size:12.5px;line-height:16px}
.qlist button:hover{border-color:var(--faint)}
.qlist small{display:block;font-family:var(--mono);font-size:10.5px;color:var(--faint)}
.qempty{font-size:12.5px;color:var(--faint)}
#qMsg{font-size:12.5px;color:var(--muted)}
@media (max-width:820px){ .qgrid{grid-template-columns:1fr;grid-template-rows:none} .axis{display:none} }
.rates button.on{color:#fff;border-color:transparent}
.chain{list-style:none;margin:0;padding:0;font-size:13px;line-height:18px}
.chain li{display:flex;gap:8px;padding:3px 0}
.chain li .n{font-family:var(--mono);font-size:11px;color:var(--faint);width:18px;flex:none;padding-top:1px;text-align:right}
.chain li button{border:0;background:none;padding:0;text-align:left;cursor:pointer;color:var(--ink)}
.chain li button:hover{color:var(--accent);text-decoration:underline}
.chain li.how{font-family:var(--mono);font-size:10px;color:var(--faint);padding:0 0 0 26px}
.kids{display:flex;flex-direction:column;gap:5px}
.kids button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;text-align:left;font-size:13px;line-height:17px;cursor:pointer;display:flex;justify-content:space-between;gap:10px}
.kids button:hover{border-color:var(--faint)}
.kids small{font-family:var(--mono);color:var(--faint);font-size:11px}
.leafnote{font-size:13px;color:var(--muted)}
.pactions{display:flex;gap:6px;flex-wrap:wrap}
.px{position:absolute;right:10px;top:10px}
/* legend */
#legend{position:fixed;left:14px;bottom:14px;z-index:14;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:12px;display:flex;flex-direction:column;gap:6px;max-width:260px;box-shadow:0 4px 14px rgba(0,0,0,.06)}
#legend .row{display:flex;align-items:center;gap:7px;color:var(--muted)}
#legend i{width:10px;height:10px;border-radius:3px;flex:none}
#legend .lt{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--muted)}
#legend .hint{font-size:11px;color:var(--faint);border-top:1px solid var(--line);padding-top:6px;line-height:15px}
/* outline view */
#outline{position:fixed;top:var(--toph);left:0;right:0;bottom:0;overflow:auto;background:var(--bg);display:none;z-index:17;padding:24px 16px 60px}
#outline .wrap{max-width:860px;margin:0 auto}
#outline ul{list-style:none;margin:0;padding-left:20px;border-left:1px solid var(--line)}
#outline>.wrap>ul{padding-left:0;border:0}
#outline li{margin:5px 0}
#outline .row{display:flex;gap:8px;align-items:baseline}
#outline .lv{font-family:var(--mono);font-size:10.5px;color:var(--faint);width:26px;flex:none}
#outline .tt{font-size:14px;line-height:20px}
#outline .tt.b{font-weight:700}
#outline .nt{font-size:12.5px;color:var(--muted);line-height:18px;margin:2px 0 0 34px;max-width:65ch}
#outline .oq{font-size:12.5px;color:var(--q);line-height:18px;margin:2px 0 0 34px;max-width:65ch;font-weight:500}
#outline .op{font-family:var(--mono);font-size:10px;color:#fff;border-radius:7px;padding:0 5px}
@media (max-width:1700px){ .stats{display:none!important} #q{width:180px} }
@media (max-width:1560px){ #zo,#zi{display:none!important} }
@media (max-width:1360px){ #deep{display:none!important} }
@media (max-width:1300px){ #saveState{display:none!important} }
@media (max-width:820px){
  :root{--toph:136px}
  #top{flex-wrap:wrap;align-content:center;row-gap:8px;padding:8px 12px}
  #top h1{width:100%;font-size:15px;min-width:0}
  .controls{margin-left:0;width:100%}
  .searchwrap{flex:1}#q{width:100%}#results{width:calc(100vw - 24px);right:auto;left:0}
  .stats{display:none}
  #panel{left:8px;right:8px;width:auto;top:auto;height:58%;bottom:8px}
  #legend{display:none}
  .hide-sm{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* ---- studio skin ---- */
.titlewrap{display:flex;flex-direction:column;gap:1px;min-width:0;flex:0 1 auto}
.eyebrowtop #countTop{white-space:pre;color:var(--faint)}
.eyebrowtop{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
#legend .ltoggle{display:flex;align-items:center;gap:7px;width:100%;border:1px solid var(--line);background:var(--tile);padding:6px 8px;border-radius:9px;cursor:pointer;font-size:12px;font-weight:600;color:var(--ink);margin-top:2px}
#legend .ltoggle:hover{background:var(--surface)}
.node.dim{opacity:.5}
.node.dim:hover{opacity:.85}
#legend .lrow{display:flex;align-items:center;gap:7px;width:100%;border:1px solid transparent;background:none;padding:4px 6px;margin:0 -6px;border-radius:9px;cursor:pointer;text-align:left;color:var(--muted);font-size:12px}
#legend .lrow:hover{background:var(--tile)}
#legend .lrow.on{background:var(--rbg);border-color:var(--rc);color:var(--ink);font-weight:600}
#legend .lrow small{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--faint)}
#legend .lrow.on small{color:var(--ink)}

.btn:hover{border-color:var(--line);background:var(--surface)}
.btn.on,#saveBtn.primary{background:var(--strong);color:var(--onstrong);border-color:var(--strong)}
#top{inset:10px 12px auto 12px;height:calc(var(--toph) - 14px);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}

.tog:hover{background:var(--strong);color:var(--onstrong);border-color:var(--strong)}

.notes{background:var(--tile);border-radius:12px}

.qcell .qs{color:var(--muted)}
.qcell .qg{color:var(--ink);opacity:.8}
.qlist{padding:0 6px 6px}
.qlist button{border-radius:11px;border-color:transparent;background:var(--tile)}
.qlist button:hover{border-color:var(--line);background:var(--surface)}
.qhead p{font-size:13.5px}
#quad .wrap{max-width:1200px}
.qbox{border-left:0;border-radius:12px}
#outline .tt.b{font-family:var(--display);font-weight:600;letter-spacing:-.005em}
#banner{background:var(--strong);color:var(--onstrong)}
@media (max-width:820px){ #top{inset:6px 6px auto 6px;height:auto} }
</style>
</head>
<body class="view-map">
<header id="top">
  <div class="titlewrap"><div class="eyebrowtop"><span id="eyebrowTop">__EYEBROW__</span><span id="countTop"></span></div><h1 id="title"></h1></div>
  <nav class="tabs" aria-label="Views"><button id="tabMap" class="on">Map</button><button id="tabQuad">2x2</button><button id="tabOutline">Outline</button></nav>
  <div class="stats maponly"><span><b id="sDepth"></b> levels</span><span><b id="sNodes"></b> nodes</span><span><b id="sLeaves"></b> tasks at the bottom</span><span><b id="sRated"></b> rated</span></div>
  <div class="controls">
    <div class="searchwrap maponly"><input id="q" type="search" placeholder="Search  ( / )" autocomplete="off" aria-label="Search nodes"><div id="results" role="listbox"></div></div>
    <label class="lvlpick hide-sm maponly" for="lvSel">Level <select id="lvSel"></select></label>
    <button class="btn maponly" id="qBtn" hidden title="Step through nodes that need the owner's input">Open questions</button>
    <button class="btn hide-sm maponly" id="deep" title="Step through the longest how? chains">Deepest paths</button>
    <button class="btn icon hide-sm maponly" id="zo" aria-label="Zoom out">−</button>
    <button class="btn icon hide-sm maponly" id="zi" aria-label="Zoom in">+</button>
    <button class="btn maponly" id="collapseAll" title="Close every branch back to the top level">Collapse all</button>
    <button class="btn maponly" id="fit">Fit</button>
    <div id="saveWrap"><span id="saveState" role="status"></span><button class="btn" id="saveBtn" title="Save a copy of this map with your ratings in it">Save my map</button></div>
  </div>
</header>
<div id="ruler"></div>
<div id="stage"><div id="world"><svg id="links"></svg></div></div>
<div id="banner"><span id="bannerT"></span><button id="unfocus">Show everything</button></div>
<aside id="panel" aria-label="Node details">
  <div class="ph"><button class="btn icon px" id="px" aria-label="Close">×</button><div class="eyebrow" id="pLv"></div><h2 id="pT"></h2></div>
  <div class="pb">
    <div class="qbox" id="pQ"></div>
    <div class="notes" id="pN"></div>
    <div class="sect"><h3>How well do I do this today?</h3><div class="rates" id="pR"></div><div class="savenote" id="pSave"></div></div>
    <div class="sect"><h3>The "how?" chain from the top</h3><ul class="chain" id="pC"></ul></div>
    <div class="sect"><h3 id="pKh"></h3><div class="kids" id="pK"></div></div>
    <div class="pactions"><button class="btn" id="focusBtn">Focus on this branch</button><button class="btn" id="copyBtn">Copy the path</button></div>
  </div>
</aside>
<div id="legend"></div>
<div id="outline"><div class="wrap" id="outlineWrap"></div></div>
<div id="quad"><div class="wrap">
  <div class="qhead"><p id="qIntro"></p><div class="acts"><button class="btn" id="rCopy">Copy ratings for Claude</button><button class="btn" id="rClear">Clear all</button></div></div>
  <div id="qMsg"></div>
  <div class="qgrid" id="qgrid"></div>
</div></div>
<script>
const PRISTINE = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
const DATA = __DATA__;
const SPLIT = __SPLIT__;
const RATINGS = [
  {n:1,label:"Don't know",color:"var(--r1)",bg:"var(--r1bg)"},
  {n:2,label:"Needs improvement",color:"var(--r2)",bg:"var(--r2bg)"},
  {n:3,label:"Can do with focus",color:"var(--r3)",bg:"var(--r3bg)"},
  {n:4,label:"Autopilot",color:"var(--r4)",bg:"var(--r4bg)"}];
// Muted, even-weight hues that sit together and keep white text readable on filled nodes.
const PALETTE = ["#3f6f9a","#1f8a78","#a8661a","#7a50b0","#5d6b7e","#2e7d9a","#9a5a7a","#6b7d34"];
const COLW=272, NODEW=224, GAP=10, PADX=40, PADY=36;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const world=$('world'), svg=$('links'), stage=$('stage');
$('title').textContent = document.title;


// ---------- model ----------
let all=[], maxDepth=0, groups=[];
(function prep(n,d,p,g){
  n.id=all.length; n.d=d; n.p=p; all.push(n); if(d>maxDepth) maxDepth=d;
  n.q=n.n.filter(x=>x.startsWith('? ')).map(x=>x.slice(2)); n.n=n.n.filter(x=>!x.startsWith('? '));
  if (p && SPLIT.includes(p.t) && !SPLIT.includes(n.t)) { g = groups.length; groups.push(n); }
  n.g = g; n.open = d < 4;
  if (p && SPLIT.includes(n.t)) { n.g = -1; }
  n.c.forEach(c=>prep(c,d+1,n,g));
})(DATA,1,null,-1);
const leaves = all.filter(n=>!n.c.length);
const perLevel = Array(maxDepth+1).fill(0); all.forEach(n=>perLevel[n.d]++);
const colorOf = n => n.g<0 ? 'var(--ink)' : PALETTE[(n.g)%PALETTE.length];
$('sDepth').textContent=maxDepth;
{ const own=$('eyebrowTop').textContent.trim(); $('countTop').textContent=(own?'  ·  ':'')+all.length+' nodes  ·  '+maxDepth+' levels'; if(!own) $('eyebrowTop').remove(); } $('sNodes').textContent=all.length; $('sLeaves').textContent=leaves.length;

// ratings (kept in this browser only)
const RKEY='mindmap-ratings:'+document.title;
// Ratings live in three places, newest wins: inside this file (saved with "Save my map"), this browser, and the viewer's Claude account when the map is opened on claude.ai.
const BAKED = /*RATINGS*/__RATINGS__/*END*/;
let rates = Object.assign({}, BAKED.ratings||{}), updatedAt = BAKED.savedAt||0, fileSavedAt = BAKED.savedAt||0;
try{ const loc=JSON.parse(localStorage.getItem(RKEY)||'null');
  if(loc){ const lr = loc.ratings ? loc : {updatedAt:1, ratings:loc}; if((lr.updatedAt||0) > updatedAt){ rates=Object.assign({},lr.ratings); updatedAt=lr.updatedAt; } } }catch(e){}
function saveRates(){ updatedAt=Date.now(); try{localStorage.setItem(RKEY,JSON.stringify({updatedAt,ratings:rates}));}catch(e){} cloudQueue(); saveStatus(); }
const keyOf = n => { const a=[]; for(let p=n;p;p=p.p) a.unshift(p.t); return a.join(' > '); };
const rateOf = n => rates[keyOf(n)] || 0;
function setRate(n,v){ const k=keyOf(n); rates[k] = rates[k]===v ? 0 : v; saveRates(); paintNode(n); updateStats(); legend(); if(sel===n) showPanel(n); if(rateMode) render(); if(quadOn) buildQuad(); }
function updateStats(){ $('sRated').textContent = all.filter(rateOf).length; if($('legend').innerHTML) legend(); }

// ---------- nodes ----------
const cv=document.createElement('canvas').getContext('2d');
function measure(n){
  const big=n.d<=2, size=big?14:12.5, lh=big?19:16, w=big?700:(n.d===3?600:400);
  cv.font=`${w} ${size}px "Manrope", system-ui, sans-serif`;
  const max=NODEW-38-(n.n.length?12:0), words=n.t.split(' '), out=[]; let cur='';
  words.forEach(x=>{ const t=cur?cur+' '+x:x; if(cv.measureText(t).width>max && cur){out.push(cur);cur=x;} else cur=t; });
  out.push(cur); n.h = out.length*lh + 14;
}
function build(){
  all.forEach(n=>{
    const e=document.createElement('div');
    e.className='node d'+Math.min(n.d,4)+(n.c.length?'':' leaf');
    e.style.width=NODEW+'px'; e.tabIndex=-1; e.setAttribute('role','treeitem');
    e.innerHTML=`<span class="t">${esc(n.t)}</span>${n.q.length?'<span class="qd" title="Needs the owner\'s input">?</span>':(n.n.length?'<span class="dot" title="Has notes"></span>':'')}<span class="rate" hidden></span>${n.c.length?'<span class="tog"></span>':''}`;
    e.addEventListener('click',ev=>{ ev.stopPropagation(); if(moved) return;
      if(ev.target.classList.contains('tog')){ n.open=!n.open; render(); return; }
      if(n.c.length && !n.open){ n.open=true; render(); }
      select(n); });
    world.appendChild(e); n.el=e; paintNode(n);
  });
}
function paintNode(n){
  // Color means one thing only: the 1 to 4 rating. Unrated nodes stay neutral.
  const r=rateOf(n), e=n.el, badge=e.querySelector('.rate'), c = r ? RATINGS[r-1].color : '';
  e.classList.toggle('rated', !!r);
  const bg = r ? RATINGS[r-1].bg : '';
  if(!showColors){ e.style.background=''; e.style.borderColor=''; e.style.color=''; badge.hidden = !r; if(r){ badge.textContent=r; badge.style.background='var(--muted)'; } e.classList.remove('rated'); e.classList.toggle('dim', !!ratingFilter && r!==ratingFilter); return; }
  if(n.d<=2){ e.style.background = r ? bg : ''; e.style.borderColor = r ? c : ''; e.style.color = r ? 'var(--ink)' : ''; }
  else { e.style.background = r ? bg : ''; e.style.borderColor = r ? c : ''; }
  if(r){ badge.hidden=false; badge.textContent=r; badge.style.background=c; } else badge.hidden=true;
  e.classList.toggle('dim', !!ratingFilter && r!==ratingFilter);
}

// ---------- layout ----------
let focusNode=null;
let litSet=null;
function visible(n){
  if(litSet && !litSet.has(n.id)) return false;
  if(focusNode){ let inF=false; for(let p=n;p;p=p.p) if(p===focusNode){inF=true;break;}
    if(!inF){ let anc=false; for(let p=focusNode;p;p=p.p) if(p===n){anc=true;break;} if(!anc) return false; } }
  for(let p=n.p;p;p=p.p) if(!p.open) return false; return true;
}
function kidsOf(n){ return n.open ? n.c.filter(visible) : []; }
function layout(n,top){
  n.x=PADX+(n.d-1)*COLW;
  const k=kidsOf(n);
  if(!k.length){ n.y=top; return top+n.h+GAP; }
  let t=top; k.forEach(c=>{ t=layout(c,t); });
  const mid=(k[0].y+k[0].h/2 + k[k.length-1].y+k[k.length-1].h/2)/2;
  n.y=mid-n.h/2;
  if(n.y<top){ const s=top-n.y; k.forEach(c=>shift(c,s)); n.y=top; t+=s; }
  return Math.max(t,n.y+n.h+GAP);
}
function shift(n,s){ n.y+=s; kidsOf(n).forEach(c=>shift(c,s)); }
let H=0, W=0, pathSet=new Set();
function render(){
  H=layout(DATA,PADY); let maxD=1, paths='';
  all.forEach(n=>{
    const v=visible(n); n.el.style.display=v?'':'none'; if(!v) return;
    if(n.d>maxD) maxD=n.d;
    n.el.style.left=n.x+'px'; n.el.style.top=n.y+'px';
    const tg=n.el.querySelector('.tog'); if(tg) tg.textContent = n.open ? '−' : n.c.length;
    n.el.classList.toggle('onpath', pathSet.has(n.id));
    paintNode(n);
    kidsOf(n).forEach(k=>{
      const x1=n.x+NODEW+12, y1=n.y+n.h/2, x2=k.x, y2=k.y+k.h/2, mx=(x1+x2)/2;
      const on=pathSet.has(k.id), col = on ? 'var(--ink)' : 'var(--link)';
      paths+=`<path d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}" fill="none" stroke="${col}" stroke-opacity="${on?1:.9}" stroke-width="${on?2.6:1.3}"/>`;
    });
  });
  W=PADX+maxD*COLW; svg.setAttribute('width',W); svg.setAttribute('height',H+PADY); svg.innerHTML=paths;
  drawBands(maxD); ruler();
}
const bands=[];
function drawBands(maxD){
  while(bands.length<maxDepth){ const b=document.createElement('div'); b.className='band'; world.insertBefore(b,svg); bands.push(b); }
  bands.forEach((b,i)=>{ b.style.left=(PADX+i*COLW-24)+'px'; b.style.width=COLW+'px'; b.style.background=i%2?'var(--band)':'transparent'; b.style.display=i<maxD?'':'none'; });
}
const rulerEls=[];
for(let i=1;i<=maxDepth;i++){ const d=document.createElement('div'); d.className='lvl'; d.innerHTML=`L${i} <span>${perLevel[i]}</span>`; $('ruler').appendChild(d); rulerEls.push(d); }
function ruler(){ rulerEls.forEach((e,i)=>{ e.style.left=(tx+(PADX+i*COLW)*sc)+'px'; e.style.display = (i>0 && sc<.45 && i%2) ? 'none':''; }); }

// ---------- pan & zoom ----------
let tx=16, ty=16, sc=1, moved=false;
function apply(){ world.style.transform=`translate(${tx}px,${ty}px) scale(${sc})`; ruler(); }
function zoomAt(f,cx,cy){ const ns=Math.min(1.8,Math.max(.12,sc*f)); tx=cx-(cx-tx)*ns/sc; ty=cy-(cy-ty)*ns/sc; sc=ns; apply(); }
let drag=null;
stage.addEventListener('pointerdown',e=>{ if(e.target.closest('.node')) { moved=false; drag={x:e.clientX,y:e.clientY,tx,ty,soft:true}; return; } drag={x:e.clientX,y:e.clientY,tx,ty}; moved=false; stage.classList.add('drag'); });
window.addEventListener('pointermove',e=>{ if(!drag) return; const dx=e.clientX-drag.x, dy=e.clientY-drag.y; if(Math.abs(dx)+Math.abs(dy)>4) moved=true; if(moved){ tx=drag.tx+dx; ty=drag.ty+dy; apply(); } });
window.addEventListener('pointerup',()=>{ drag=null; stage.classList.remove('drag'); setTimeout(()=>moved=false,0); });
stage.addEventListener('wheel',e=>{ e.preventDefault(); const r=stage.getBoundingClientRect();
  if(e.ctrlKey||e.metaKey) zoomAt(Math.exp(-e.deltaY*0.01), e.clientX-r.left, e.clientY-r.top);
  else { tx-=e.deltaX; ty-=e.deltaY; apply(); } },{passive:false});
let pinch=null; const pts=new Map();
stage.addEventListener('pointerdown',e=>{ pts.set(e.pointerId,{x:e.clientX,y:e.clientY}); if(pts.size===2){ const [a,b]=[...pts.values()]; pinch={d:Math.hypot(a.x-b.x,a.y-b.y)}; drag=null; } });
stage.addEventListener('pointermove',e=>{ if(!pts.has(e.pointerId)) return; pts.set(e.pointerId,{x:e.clientX,y:e.clientY}); if(pinch && pts.size===2){ const [a,b]=[...pts.values()], d=Math.hypot(a.x-b.x,a.y-b.y), r=stage.getBoundingClientRect(); zoomAt(d/pinch.d,(a.x+b.x)/2-r.left,(a.y+b.y)/2-r.top); pinch.d=d; } });
['pointerup','pointercancel'].forEach(t=>stage.addEventListener(t,e=>{ pts.delete(e.pointerId); if(pts.size<2) pinch=null; }));
function fit(){ const r=stage.getBoundingClientRect(), pw=$('panel').classList.contains('open')&&innerWidth>820?400:0;
  const w=W+20, h=H+PADY; sc=Math.min(1,Math.max(.12,Math.min((r.width-pw-20)/w,(r.height-20)/h)));
  tx=Math.max(12,(r.width-pw-w*sc)/2); ty=Math.max(12,(r.height-h*sc)/2); apply(); }
function reveal(n){ const r=stage.getBoundingClientRect(), pw=$('panel').classList.contains('open')&&innerWidth>820?400:0;
  const cx=tx+(n.x+NODEW/2)*sc, cy=ty+(n.y+n.h/2)*sc;
  if(cx<40||cx>r.width-pw-40||cy<30||cy>r.height-30){ tx=(r.width-pw)*0.45-(n.x+NODEW/2)*sc; ty=r.height/2-(n.y+n.h/2)*sc; apply(); } }
$('zi').onclick=()=>{ const r=stage.getBoundingClientRect(); zoomAt(1.2,r.width/2,r.height/2); };
$('zo').onclick=()=>{ const r=stage.getBoundingClientRect(); zoomAt(1/1.2,r.width/2,r.height/2); };
$('fit').onclick=fit;
$('collapseAll').onclick=()=>{ if(ratingFilter) filterBy(ratingFilter); if(focusNode) unfocus(false); clearPath(); all.forEach(n=>n.open = n.d<2); $('lvSel').value=2; render(); fit(); };

// ---------- selection & panel ----------
let sel=null;
function select(n,{center=false}={}){
  if(sel) sel.el.classList.remove('sel');
  sel=n; n.el.classList.add('sel'); showPanel(n);
  if(center) reveal(n);
}
function showPanel(n){
  $('panel').classList.add('open');
  $('pLv').textContent=`LEVEL ${n.d} OF ${maxDepth}${n.c.length?'':'  ·  BOTTOM OF THE BRANCH'}`;
  $('pT').textContent=n.t;
  $('pN').style.display=n.n.length?'':'none'; $('pN').textContent=n.n.join(' ');
  $('pQ').style.display=n.q.length?'':'none'; $('pQ').innerHTML=n.q.length?'<b>OPEN QUESTION FOR THE OWNER</b>'+n.q.map(esc).join('<br>'):'';
  const r=rateOf(n);
  $('pR').innerHTML=RATINGS.map(x=>`<button data-r="${x.n}" class="${r===x.n?'on':''}" style="--rc:${x.color};--rbg:${x.bg}" title="Click again to clear"><b>${x.n}</b><span>${x.label}</span></button>`).join('');
  $('pR').querySelectorAll('button').forEach(b=>b.onclick=()=>setRate(n,+b.dataset.r));
  const ch=[]; for(let p=n;p;p=p.p) ch.unshift(p);
  $('pC').innerHTML=ch.map((p,i)=>(i?'<li class="how">↓ how?</li>':'')+`<li><span class="n">${p.d}</span><button data-id="${p.id}">${esc(p.t)}</button></li>`).join('');
  $('pC').querySelectorAll('button').forEach(b=>b.onclick=()=>{ const t=all[+b.dataset.id]; openTo(t); select(t,{center:true}); });
  if(n.c.length){
    $('pKh').textContent=`${n.c.length} answers to "how?"`;
    $('pK').innerHTML=n.c.map(c=>`<button data-id="${c.id}"><span>${esc(c.t)}</span><small>${c.c.length?c.c.length+' ›':'task'}</small></button>`).join('');
    $('pK').querySelectorAll('button').forEach(b=>b.onclick=()=>{ const t=all[+b.dataset.id]; n.open=true; openTo(t); select(t,{center:true}); });
  } else { $('pKh').textContent='What this is'; $('pK').innerHTML='<div class="leafnote">A task someone can put on their calendar and do. No further "how?" needed.</div>'; }
}
function openTo(n){ if(litSet && !litSet.has(n.id)){ ratingFilter=0; litSet=null; $('banner').style.display='none'; $('unfocus').textContent='Show everything'; all.forEach(paintNode); legend(); } for(let p=n.p;p;p=p.p) p.open=true; if(focusNode && !visible(n)) unfocus(false); render(); }
$('px').onclick=()=>{ $('panel').classList.remove('open'); if(sel) sel.el.classList.remove('sel'); sel=null; };
$('copyBtn').onclick=async()=>{ if(!sel) return; const ch=[]; for(let p=sel;p;p=p.p) ch.unshift(p);
  const text=ch.map((p,i)=>'  '.repeat(i)+(i?'↳ ':'')+p.t).join('\n');
  try{ await navigator.clipboard.writeText(text); $('copyBtn').textContent='Copied'; }catch(e){ $('copyBtn').textContent='Copy blocked here'; }
  setTimeout(()=>$('copyBtn').textContent='Copy the path',1500); };

// focus mode
function focusOn(n){ if(ratingFilter){ ratingFilter=0; litSet=null; all.forEach(paintNode); legend(); } focusNode=n; n.open=true; $('banner').style.display='flex'; $('bannerT').textContent='Focused on: '+n.t; render(); fit(); }
function unfocus(doRender=true){ focusNode=null; $('banner').style.display='none'; if(doRender){ render(); fit(); } }
$('focusBtn').onclick=()=>{ if(sel) focusOn(sel); };
$('unfocus').onclick=()=>{ if(ratingFilter) filterBy(ratingFilter); else unfocus(); };

// ---------- controls ----------
for(let i=2;i<=maxDepth;i++){ const o=document.createElement('option'); o.value=i; o.textContent=i; if(i===4) o.selected=true; $('lvSel').appendChild(o); }
$('lvSel').onchange=()=>{ const L=+$('lvSel').value; all.forEach(n=>n.open=n.d<L); clearPath(); render(); fit(); };
function clearPath(){ pathSet=new Set(); $('deep').classList.remove('on'); $('deep').textContent='Deepest paths'; }
let deepIdx=-1;
$('deep').onclick=()=>{
  const ends=leaves.filter(n=>n.d===maxDepth); deepIdx++;
  if(deepIdx>=ends.length){ deepIdx=-1; clearPath(); render(); fit(); return; }
  const end=ends[deepIdx]; pathSet=new Set(); all.forEach(n=>n.open=n.d<3);
  for(let p=end;p;p=p.p){ p.open=true; pathSet.add(p.id); }
  $('deep').classList.add('on'); $('deep').textContent=`Deepest path ${deepIdx+1} of ${ends.length}`;
  if(focusNode) unfocus(false); render(); fit(); select(end);
};
let rateMode=false;
let ratingFilter=0, showColors=true;
function legend(){
  const L=$('legend');
  L.innerHTML='<div class="lt">How well do I do this today?</div>'+RATINGS.map(r=>{ const c=all.filter(n=>rateOf(n)===r.n).length;
    return `<button class="row lrow${ratingFilter===r.n?' on':''}" data-r="${r.n}" style="--rc:${r.color};--rbg:${r.bg}" title="Light up the nodes rated ${r.n}"><i style="background:${r.bg};border:1.5px solid ${r.color}"></i><span>${r.n} ${r.label}</span><small>${c}</small></button>`; }).join('')
    +'<div class="row"><i style="background:var(--surface);border:1px solid var(--line)"></i>Not rated yet</div>'
    +`<button class="ltoggle" id="colorToggle">${showColors?'Hide rating colors':'Show rating colors'}</button>`
    +'<div class="hint">Click a rating to light up its nodes. Click a node, then press 1 to 4 to rate it.</div>';
  L.querySelectorAll('.lrow').forEach(b=>b.onclick=()=>filterBy(+b.dataset.r));
  $('colorToggle').onclick=()=>{ showColors=!showColors; all.forEach(paintNode); legend(); };
}
function filterBy(r){
  ratingFilter = ratingFilter===r ? 0 : r;
  if(ratingFilter){
    const m=all.filter(n=>rateOf(n)===ratingFilter);
    if(focusNode) unfocus(false);
    litSet=new Set(); m.forEach(n=>{ for(let p=n;p;p=p.p){ litSet.add(p.id); if(p!==n) p.open=true; } });
    const R=RATINGS[ratingFilter-1];
    $('banner').style.display='flex'; $('bannerT').textContent = m.length ? `Lit up: ${m.length} node${m.length>1?'s':''} rated ${R.n} ${R.label}` : `No nodes rated ${R.n} ${R.label} yet`;
    $('unfocus').textContent='Clear';
  } else { litSet=null; $('banner').style.display='none'; $('unfocus').textContent='Show everything'; }
  all.forEach(paintNode); legend(); render(); fit();
}
// open questions
const qNodes = all.filter(n=>n.q.length); let qIdx=-1;
if(qNodes.length){ $('qBtn').hidden=false; $('qBtn').textContent=`Open questions (${qNodes.length})`; }
$('qBtn').onclick=()=>{ qIdx=(qIdx+1)%qNodes.length; const n=qNodes[qIdx]; $('qBtn').textContent=`Open question ${qIdx+1} of ${qNodes.length}`; openTo(n); select(n,{center:true}); };
// search
const q=$('q'), res=$('results'); let hits=[], hi=0;
function runSearch(){
  const s=q.value.trim().toLowerCase(); all.forEach(n=>n.el.classList.remove('hit'));
  if(s.length<2){ res.style.display='none'; return; }
  hits=all.filter(n=>(n.t+' '+n.n.join(' ')).toLowerCase().includes(s)).slice(0,40); hi=0;
  hits.forEach(n=>n.el.classList.add('hit'));
  res.innerHTML = hits.length ? hits.map((n,i)=>`<button data-i="${i}" class="${i===0?'cur':''}"><small>L${n.d} · ${esc((n.p&&n.p.t)||'')}</small>${esc(n.t)}</button>`).join('') : '<div style="padding:10px;color:var(--muted);font-size:13px">No matches</div>';
  res.style.display='block';
  res.querySelectorAll('button').forEach(b=>b.onclick=()=>goHit(+b.dataset.i));
}
function goHit(i){ const n=hits[i]; if(!n) return; res.style.display='none'; openTo(n); select(n,{center:true}); }
q.addEventListener('input',runSearch);
q.addEventListener('keydown',e=>{ if(e.key==='ArrowDown'||e.key==='ArrowUp'){ e.preventDefault(); hi=(hi+(e.key==='ArrowDown'?1:-1)+hits.length)%Math.max(hits.length,1); res.querySelectorAll('button').forEach((b,i)=>b.classList.toggle('cur',i===hi)); }
  if(e.key==='Enter'){ goHit(hi); q.blur(); } if(e.key==='Escape'){ res.style.display='none'; q.blur(); } });
document.addEventListener('click',e=>{ if(!e.target.closest('.searchwrap')) res.style.display='none'; });
// keyboard
document.addEventListener('keydown',e=>{
  if(e.target.matches('input,select')) return;
  if(e.key==='/'){ e.preventDefault(); q.focus(); return; }
  if(e.key==='f'){ fit(); return; }
  if(e.key==='Escape'){ if(ratingFilter) filterBy(ratingFilter); else if(focusNode) unfocus(); else $('px').click(); return; }
  if(!sel){ if(e.key.startsWith('Arrow')){ select(DATA,{center:true}); e.preventDefault(); } return; }
  const sib = sel.p ? sel.p.c : [sel], i=sib.indexOf(sel); let t=null;
  if(e.key==='ArrowRight'){ if(sel.c.length){ sel.open=true; render(); t=sel.c[0]; } }
  else if(e.key==='ArrowLeft') t=sel.p;
  else if(e.key==='ArrowDown') t=sib[i+1];
  else if(e.key==='ArrowUp') t=sib[i-1];
  else if(e.key==='Enter'||e.key===' '){ if(sel.c.length){ sel.open=!sel.open; render(); } e.preventDefault(); return; }
  else if(/^[1-4]$/.test(e.key)){ setRate(sel,+e.key); return; }
  if(t){ e.preventDefault(); openTo(t); select(t,{center:true}); }
});
// outline view
let outlineOn=false;
function buildOutline(){
  const li=n=>{ const r=rateOf(n);
    return `<li><div class="row"><span class="lv">L${n.d}</span><span class="tt ${n.d<=3?'b':''}">${esc(n.t)}</span>${r?`<span class="op" style="background:${RATINGS[r-1].color}">${r}</span>`:''}</div>${n.n.length?`<div class="nt">${esc(n.n.join(' '))}</div>`:''}${n.q.length?`<div class="oq">Open question: ${esc(n.q.join(' '))}</div>`:''}${n.c.length?'<ul>'+n.c.map(li).join('')+'</ul>':''}</li>`; };
  $('outlineWrap').innerHTML='<ul>'+li(DATA)+'</ul>';
}
let quadOn=false;
function setView(v){
  outlineOn = v==='outline'; quadOn = v==='quad';
  document.body.className='view-'+(outlineOn?'outline':quadOn?'quad':'map');
  $('tabMap').classList.toggle('on',v==='map'); $('tabQuad').classList.toggle('on',quadOn); $('tabOutline').classList.toggle('on',outlineOn);
  if(outlineOn) buildOutline(); if(quadOn) buildQuad();
  if(v!=='map') $('px').click();
  $('outline').style.display=outlineOn?'block':'none'; $('quad').style.display=quadOn?'block':'none';
  $('legend').style.display = v==='map' ? '' : 'none'; $('ruler').style.display = v==='map' ? '' : 'none';
}
$('tabMap').onclick=()=>setView('map'); $('tabQuad').onclick=()=>setView('quad'); $('tabOutline').onclick=()=>setView('outline');
// 2x2: the four stages of competence. Columns: competence low to high. Rows: awareness high (top) to low (bottom).
const QUADS=[
  {r:2,title:"Learn it with AI beside you",text:"A known gap. Learn it first, so you can tell when AI's work is good."},
  {r:3,title:"Build this first",text:"Done well, but it takes effort every time. Ready to become a skill."},
  {r:1,title:"Find the blind spots",text:"Gaps no one could see yet. Mapping is what brings them to the surface."},
  {r:4,title:"Get it out of your head",text:"Done so well no one notices how. Spell it out so AI and the team can do it your way."}];
function buildQuad(){
  const rated=all.filter(rateOf);
  $('qIntro').innerHTML=`<b style="color:var(--ink)">${rated.length} of ${all.length}</b> nodes rated. ${saveSentence()}`;
  let h='<div class="axis y"><span>Low awareness</span><span>High awareness</span></div>';
  QUADS.forEach(q=>{ const R=RATINGS[q.r-1], items=rated.filter(n=>rateOf(n)===q.r).sort((a,b)=>a.d-b.d||a.id-b.id);
    h+=`<section class="qcell" style="--c:${R.color};--cbg:${R.bg}"><div class="qtile"><div class="qt"><span class="qn">${q.r}</span><div><h4>${R.label}</h4><div class="qs">${['','Unconscious incompetence','Conscious incompetence','Conscious competence','Unconscious competence'][q.r]}</div></div><span class="qc">${items.length}</span></div>
      <div class="qg"><b>${q.title}.</b> ${q.text}</div></div>
      <div class="qlist">${items.length?items.map(n=>`<button data-id="${n.id}"><small>L${n.d} · ${esc(n.p?n.p.t:'')}</small>${esc(n.t)}</button>`).join(''):'<div class="qempty">Nothing here yet. In the map, click a node and rate it, or press 1 to 4.</div>'}</div></section>`; });
  h+='<div class="axis x"><span>Low competence</span><span>High competence</span></div>';
  $('qgrid').innerHTML=h;
  $('qgrid').querySelectorAll('.qlist button').forEach(b=>b.onclick=()=>{ const n=all[+b.dataset.id]; setView('map'); openTo(n); select(n,{center:true}); });
}
function exportText(){ const out={}; Object.keys(rates).forEach(k=>{ if(rates[k]) out[k]=rates[k]; }); return JSON.stringify({map:document.title,scale:"1 Don't know, 2 Needs improvement, 3 Can do with focus, 4 Autopilot",ratings:out},null,2); }
function flash(t){ $('qMsg').textContent=t; setTimeout(()=>{ if($('qMsg').textContent===t) $('qMsg').textContent=''; },3500); }
$('rCopy').onclick=async()=>{ try{ await navigator.clipboard.writeText(exportText()); flash('Ratings copied. Paste them into a chat with Claude.'); }catch(e){ flash('Copying is blocked here. Use "Save my map" instead.'); } };
let clearArm=false;
$('rClear').onclick=()=>{ if(!clearArm){ clearArm=true; $('rClear').textContent='Click again to clear'; setTimeout(()=>{ clearArm=false; $('rClear').textContent='Clear all'; },3000); return; }
  all.forEach(n=>{ rates[keyOf(n)]=0; }); saveRates(); all.forEach(paintNode); updateStats(); buildQuad(); if(rateMode) render(); clearArm=false; $('rClear').textContent='Clear all'; flash('All ratings cleared.'); };
window.addEventListener('resize',()=>ruler());

// ---------- saving ----------
const isLocalFile = location.protocol==='file:';
let cloud=null, cloudBusy=false, cloudAgain=false, cloudTimer=null, fileHandle=null, saving=false;
function dirtyFile(){ return updatedAt > fileSavedAt; }
function saveSentence(){
  if(cloud) return 'Your ratings save to your Claude account automatically, on any device. "Save my map" also gives you a file with your ratings inside.';
  return 'Your ratings save in this browser as you go. To keep them for good or open them elsewhere, use "Save my map": it saves a copy of this map with your ratings inside. Reopen that file anytime.';
}
function saveStatus(){
  const st=$('saveState'), dirty=dirtyFile() && !cloud;
  st.classList.toggle('dirty',dirty);
  st.innerHTML = '<i></i>' + (saving ? 'Saving…' : cloud ? (cloudBusy?'Saving…':'Saved to your account') : dirty ? 'Unsaved changes' : ((fileSavedAt||Object.keys(BAKED.ratings||{}).length)?'Saved in this file':'Nothing to save yet'));
  $('saveBtn').classList.toggle('primary',dirty);
  if($('pSave')) $('pSave').textContent = cloud ? 'Saves to your Claude account automatically.' : 'Saves in this browser as you go. Use "Save my map" to keep a copy with your ratings.';
}
function cloudQueue(){ if(!cloud) return; clearTimeout(cloudTimer); cloudTimer=setTimeout(cloudWrite,1200); }
async function cloudWrite(){
  if(!cloud) return; if(cloudBusy){ cloudAgain=true; return; }
  cloudBusy=true; saveStatus();
  try{ await cloud.set({updatedAt, ratings:rates}); }catch(e){ if(e && (e.code==='invalid_argument'||e.code==='revoked'||e.code==='not_granted')) { cloud=null; } }
  cloudBusy=false; saveStatus(); if(cloudAgain){ cloudAgain=false; cloudWrite(); }
}
async function cloudInit(){
  try{
    if(!(window.claude && window.claude.use)) return;
    const [db,user]=await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    if(!db||!user) return; const uid=await user.id(); if(!uid) return;
    const key='ratings-'+document.title.toLowerCase().replace(/[^a-z0-9]+/g,'-').slice(0,80);
    const ref=db.collection('data/users/'+uid).doc(key);
    const snap=await ref.get();
    if(snap.exists){ const d=snap.data()||{}; if((d.updatedAt||0) > updatedAt){ rates=Object.assign({},d.ratings||{}); updatedAt=d.updatedAt; try{localStorage.setItem(RKEY,JSON.stringify({updatedAt,ratings:rates}));}catch(e){} all.forEach(paintNode); updateStats(); if(rateMode) render(); if(quadOn) buildQuad(); if(sel) showPanel(sel); } }
    cloud=ref; saveStatus(); if(quadOn) buildQuad();
    if(!snap.exists || (snap.data()||{}).updatedAt < updatedAt) cloudWrite();
  }catch(e){ cloud=null; }
}
function fileText(){ const savedAt=Date.now(); const data=JSON.stringify({savedAt, ratings:rates}).replace(/<\//g,'<\\/');
  return { savedAt, html: PRISTINE.replace(/\/\*RATINGS\*\/[\s\S]*?\/\*END\*\//, ()=>'/*RATINGS*/'+data+'/*END*/') }; }
function fileName(){ return (document.title.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'mind-map')+'.html'; }
$('saveBtn').onclick=async()=>{
  const {savedAt,html}=fileText(); saving=true; saveStatus();
  try{
    if(isLocalFile && window.showSaveFilePicker){
      if(!fileHandle) fileHandle = await window.showSaveFilePicker({suggestedName:fileName(), types:[{description:'Mind map',accept:{'text/html':['.html']}}]});
      const w=await fileHandle.createWritable(); await w.write(html); await w.close();
    } else {
      let dl=null; try{ dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null; }catch(e){}
      if(dl) await dl.save({filename:fileName(), data:html});
      else { const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([html],{type:'text/html'})); a.download=fileName(); document.body.appendChild(a); a.click(); a.remove(); }
    }
    fileSavedAt=Math.max(savedAt,updatedAt);
  }catch(e){ /* cancelled or blocked: keep the unsaved state */ }
  saving=false; saveStatus();
};
window.addEventListener('beforeunload',e=>{ if(isLocalFile && dirtyFile() && !cloud){ e.preventDefault(); e.returnValue=''; } });

// ---------- start ----------
function start(){ all.forEach(measure); build(); legend(); updateStats(); render(); fit(); saveStatus(); cloudInit(); }
(document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(start);
</script>
</body>
</html>
